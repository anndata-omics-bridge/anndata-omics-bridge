000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.6387" x="96.1084" y="233.8867">Decorate column and assay names</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="279.4473" x="64.5488" y="266.418"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="259.4473" x="74.5488" y="288.0195">Augment with differential expression results</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.7949" x="74.5488" y="302.1523">Add t-SNE/UMAP/PCA/clustering results</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="224.3926" x="92.0762" y="334.6836"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="204.3926" x="102.0762" y="356.2852">Augment with gene set enrichment</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="129.8555" x="102.0762" y="370.418">and ORA/GSEA results</text><line style="stroke:#181818;stroke-width:1.5;" x1="88.7168" x2="295.9893" y1="402.9492" y2="402.9492"/><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="155.4336" x="11" y="422.9492"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="135.4336" x="21" y="444.5508">Visualize via exploreDE</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="203.1113" x="194.4336" y="422.9492"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="183.1113" x="204.4336" y="444.5508">Other visualisation applications</text><line style="stroke:#181818;stroke-width:1.5;" x1="88.7168" x2="295.9893" y1="477.082" y2="477.082"/><ellipse cx="204.2725" cy="508.082" fill="none" rx="11" ry="11" sty